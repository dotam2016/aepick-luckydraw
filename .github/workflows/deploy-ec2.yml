name: Deploy EC2

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: string

concurrency:
  group: aepick-luckydraw-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      DEPLOY_BRANCH: ${{ inputs.branch }}

    steps:
      - name: Deploy selected branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/aepick-luckydraw"

          git check-ref-format --branch "$DEPLOY_BRANCH" >/dev/null
          git fetch origin "refs/heads/$DEPLOY_BRANCH"
          git switch --detach FETCH_HEAD

          echo "Deploying branch: $DEPLOY_BRANCH"
          echo "Deploying commit: $(git rev-parse HEAD)"

          bash ./deploy-ec2.sh
